[package]
name = "nobo-calendar"
version.workspace = true
description = "Subscribing to ICS calendars and mirroring their events into the vault."
edition = "2021"
license = "GPL-3.0-or-later"

# The core and nothing else of nobo's, unless a line below says otherwise:
# reaching into another feature is a compile error here, not a lint
# failure.
# The Tauri half is optional (see nobo-review): `commands` are plain
# functions, `tauri_commands` makes them Tauri commands. Default-on, so
# the app's build is unchanged.
#
# Everything the Tauri half needs is in that list, and all of it comes
# from crates.io: this crate carries its own index listener (see
# `tauri_commands`) rather than borrowing one from the app's host crate,
# so nothing here points at a path outside these crates.
[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-specta", "dep:specta", "dep:specta-typescript"]

[dependencies]
nobo-http = { path = "../nobo-http" }
nobo-ical = { path = "../nobo-ical" }
nobo-calendar-mirror = { path = "../nobo-calendar-mirror" }
nobo-core = { path = "../nobo-core" }
tauri = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
ical = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Nur noch für die Tests: die Zeitzonen-Rechnung selbst liegt in nobo-ical.
chrono-tz = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }

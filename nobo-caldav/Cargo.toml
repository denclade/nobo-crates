[package]
name = "nobo-caldav"
version = "0.1.0"
description = "Two-way CalDAV sync for task lists and calendars from a server."
edition = "2021"
license = "GPL-3.0-or-later"

# The core and nothing else of nobo's, unless a line below says otherwise:
# reaching into another feature is a compile error here, not a lint
# failure.
# The Tauri half is optional (see nobo-review): `commands` are plain
# functions, `tauri_commands` makes them Tauri commands and carries the
# progress event. Default-on, so the app's build is unchanged.
#
# Everything the Tauri half needs is in that list, and all of it comes
# from crates.io: this crate carries its own index listener and its own
# notification delivery (see `tauri_commands`) rather than borrowing them
# from the app's host crate. That keeps the plugin self-contained -- a
# host that switches the feature off pulls in nothing at all, and nothing
# here points at a path outside these crates.
[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-specta", "dep:specta", "dep:specta-typescript", "dep:tauri-plugin-notification"]

[dependencies]
nobo-http = { path = "../nobo-http" }
nobo-ical = { path = "../nobo-ical" }
nobo-webdav = { path = "../nobo-webdav" }
nobo-core = { path = "../nobo-core" }
tauri = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
tauri-plugin-notification = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }
blake3 = { workspace = true }
nobo-calendar-mirror = { path = "../nobo-calendar-mirror" }
rusqlite = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
ical = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# Only for the test that the two registries do not fight over the shared
# calendars directory -- that one is about both features by definition. No
# line of this crate's own code reaches for the ICS subscriptions.
nobo-calendar = { path = "../nobo-calendar", default-features = false }
# Nur für die Tests: die Zeitzonen-Rechnung selbst liegt in nobo-ical.
chrono-tz = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

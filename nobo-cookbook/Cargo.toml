[package]
name = "nobo-cookbook"
version.workspace = true
description = "Reading org files that declare themselves a cookbook as recipes."
edition = "2021"
license = "GPL-3.0-or-later"

# The Tauri half is optional (see nobo-core and nobo-review): `commands`
# are plain functions, `tauri_commands` makes them Tauri commands.
# Default-on, so the app's build is unchanged.
[features]
# Both on for this repo's desktop and Android app, both switched off by a
# host without a webview or without networking (default-features = false).
# `import` has to be on here and not only in the app: the app's
# bindings.ts is exported from THIS workspace, and a command compiled out
# here is a command the frontend cannot see.
default = ["tauri", "import"]
tauri = ["dep:tauri", "dep:tauri-specta", "dep:specta", "dep:specta-typescript"]
# Importing a recipe from a web page: the fetching half (see
# src/import/mod.rs). Reading a page and writing the entry are always
# there and tested without it; only the HTTP is optional, so a build
# without networking carries no HTTP stack for this.
import = ["dep:nobo-http", "dep:reqwest"]

[dependencies]
nobo-core = { path = "../nobo-core" }
tauri = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

# The core and nothing else of nobo's, unless a line below says otherwise:
# reaching into another feature is a compile error here, not a lint
# failure.
# The repair writes a file and records it in the history, which is what
# makes an automatic repair undoable -- same db handle every other
# history-recording command takes.
rusqlite = { workspace = true }
# The import's fetching half, and only with the `import` feature: the
# shared HTTP door (Android's TLS, readable errors), and reqwest for the
# client type it hands out.
nobo-http = { path = "../nobo-http", optional = true }
reqwest = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

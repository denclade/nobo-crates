[package]
name = "nobo-cookbook"
version = "0.1.0"
description = "Reading org files that declare themselves a cookbook as recipes."
edition = "2021"
license = "GPL-3.0-or-later"

# The Tauri half is optional (see nobo-core and nobo-review): `commands`
# are plain functions, `tauri_commands` makes them Tauri commands.
# Default-on, so the app's build is unchanged.
[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-specta", "dep:specta", "dep:specta-typescript"]

[dependencies]
nobo-core = { path = "../nobo-core" }
tauri = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

# The core and nothing else of nobo's, unless a line below says otherwise:
# reaching into another feature is a compile error here, not a lint
# failure.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
